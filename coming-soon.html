<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNEXA AI — Coming Soon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --panel-alt:#0d1420; --border:#1d2733;
    --text:#e8edf2; --muted:#7c8a99; --teal:#14b8a6; --teal-dim:rgba(20,184,166,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  a{color:inherit;text-decoration:none;}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:34px 28px;max-width:380px;width:100%;text-align:center;
  }
  .mark{
    width:52px;height:52px;border-radius:14px;margin:0 auto 18px;
    background:linear-gradient(135deg,var(--teal),#0891b2);
    display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  h1{font-size:18px;margin-bottom:8px;}
  p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px;}
  .btn{
    display:inline-block;background:var(--teal-dim);color:var(--teal);
    border:1px solid rgba(20,184,166,.35);padding:10px 20px;border-radius:9px;
    font-size:13px;font-weight:600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🚧</div>
    <h1 id="featureTitle">This feature</h1>
    <p>is still being built. It'll appear here once it's ready — for now, the Dashboard, Map Explorer, AI Assistant, and Reports are fully working.</p>
    <a class="btn" href="dashboard.html">← Back to Dashboard</a>
  </div>
  <script src="config.js"></script>
  <script src="coming-soon.js"></script>
  <script src="./pwa-register.js"></script>
</body>
</html>
