<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNEXA AI — Alerts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0e14; --sidebar:#0c1119; --panel:#111722; --panel-alt:#0d1420;
    --border:#1d2733; --text:#e8edf2; --muted:#7c8a99;
    --teal:#14b8a6; --teal-dim:rgba(20,184,166,0.14);
    --green:#22c55e; --red:#ef4444; --yellow:#eab308; --blue:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
  a{color:inherit;text-decoration:none;}

  .sidebar{width:230px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;transition:transform .25s ease;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#0891b2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#04231d;}
  .brand .name{font-size:15px;font-weight:700;line-height:1.1;}
  .brand .tag{font-size:10px;color:var(--muted);}
  nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500;}
  .navlink:hover{background:#141b26;color:var(--text);}
  .navlink.active{background:var(--teal-dim);color:var(--teal);}

  .main{margin-left:230px;flex:1;padding:18px 24px 40px;min-width:0;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .hamburger{display:none;}
  h1{font-size:20px;}
  .subtitle{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .filter-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-tab{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;}
  .filter-tab.active{background:var(--teal-dim);border-color:rgba(20,184,166,.4);color:var(--teal);}

  .alert-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;}
  .alert-card.unread{border-left:3px solid var(--teal);}
  .severity-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .alert-body{flex:1;}
  .alert-title{font-size:13.5px;font-weight:700;margin-bottom:3px;}
  .alert-message{font-size:12.5px;color:#c7d2da;line-height:1.5;margin-bottom:6px;}
  .alert-meta{font-size:10.5px;color:var(--muted);}
  .mark-read-btn{background:var(--panel-alt);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:7px;font-size:11px;cursor:pointer;flex-shrink:0;}

  .empty-state{text-align:center;padding:48px 16px;color:var(--muted);}
  .empty-state .icon{font-size:32px;margin-bottom:12px;}
  .empty-state p{font-size:13px;line-height:1.6;max-width:360px;margin:0 auto;}

  @media (max-width:820px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;padding:16px;}
    .hamburger{display:flex;width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--border);align-items:center;justify-content:center;color:var(--text);order:-1;}
  }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="brand">
    <div class="mark">G</div>
    <div><div class="name">GeoNEXA AI</div><div class="tag">Connecting the World, Spatial Sense</div></div>
  </div>
  <nav>
    <a class="navlink" href="dashboard.html">🏠 Dashboard</a>
    <a class="navlink" href="map-explorer.html">🗺️ Map Explorer</a>
    <a class="navlink" href="property-analysis.html">📊 Property Analysis</a>
    <a class="navlink" href="reports.html">📄 Reports</a>
    <a class="navlink" href="saved-properties.html">❤ Saved Properties</a>
    <a class="navlink active" href="alerts.html">🔔 Alerts</a>
    <a class="navlink" href="dashboard.html">🤖 AI Assistant</a>
    <a class="navlink" href="subscription.html">💳 Subscription</a>
    <a class="navlink" href="settings.html">⚙️ Settings</a>
  </nav>
</div>

<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div>
      <h1>Alerts</h1>
      <div class="subtitle" id="subtitle">Loading…</div>
    </div>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">All</button>
    <button class="filter-tab" data-filter="unread">Unread</button>
    <button class="filter-tab" data-filter="dispute">Disputes</button>
    <button class="filter-tab" data-filter="risk">Risk</button>
    <button class="filter-tab" data-filter="report">Reports</button>
    <button class="filter-tab" data-filter="billing">Billing</button>
  </div>

  <div id="alertsList"><div class="empty-state"><p>Loading…</p></div></div>
</div>

<script src="config.js"></script>
<script src="alerts.js"></script>
</body>
</html>
