<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNEXA AI — Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#080b0f; --text:#f3f6f8; --muted:#8b99a6; --accent:#22e0ab; --accent-dim:#16a97f; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 460px at 100% -10%, rgba(34,224,171,0.06), transparent 55%), var(--bg);
    color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .mark{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#0d9488);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#06120e;margin:0 auto 18px;}
  h1{font-size:52px;font-weight:800;color:var(--accent);}
  p{font-size:14px;color:var(--muted);margin:10px 0 22px;line-height:1.6;max-width:320px;margin-left:auto;margin-right:auto;}
  a{display:inline-block;background:var(--accent);color:#06120e;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:13.5px;}
  a:hover{background:var(--accent-dim);}
</style>
</head>
<body>
  <div>
    <div class="mark">G</div>
    <h1>404</h1>
    <p>This page doesn't exist or has moved. Let's get you back to solid ground.</p>
    <a href="/">← Back to GeoNEXA</a>
  </div>
</body>
</html>
