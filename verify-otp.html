<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNEXA AI — Verify Your Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://ogwckglzluhjwmucrodb.supabase.co" crossorigin>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#080b0f; --panel:#0f151c; --border:#1d2833; --text:#f3f6f8; --muted:#8b99a6;
    --accent:#22e0ab; --accent-dim:#16a97f; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 460px at 50% -10%, rgba(34,224,171,0.08), transparent 55%), var(--bg);
    color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  a{color:var(--accent);text-decoration:none;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:32px 26px;max-width:380px;width:100%;text-align:center;}
  .mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#0d9488);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#06120e;margin:0 auto 16px;}
  h1{font-size:19px;font-weight:800;margin-bottom:6px;}
  p.sub{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:22px;}
  #emailLabel{color:var(--accent);font-weight:700;}
  .otp-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
  .otp-digit{width:42px;height:52px;text-align:center;font-size:20px;font-weight:700;background:#121a22;border:1px solid var(--border);border-radius:10px;color:var(--text);}
  .otp-digit:focus{outline:none;border-color:var(--accent);}
  #status{font-size:12.5px;min-height:18px;margin-bottom:14px;}
  .btn-solid{background:var(--accent);color:#06120e;border:none;width:100%;padding:13px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-solid:hover{background:var(--accent-dim);}
  .btn-solid:disabled{opacity:.5;cursor:not-allowed;}
  .resend{font-size:12px;color:var(--muted);margin-top:16px;}
  .resend button{background:none;border:none;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;padding:0;}
  .resend button:disabled{color:var(--muted);cursor:not-allowed;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">G</div>
    <h1>Verify your email</h1>
    <p class="sub">Enter the 6-digit code sent to<br><span id="emailLabel">your email</span></p>

    <div class="otp-row" id="otpRow">
      <input class="otp-digit" maxlength="1" inputmode="numeric" data-i="0">
      <input class="otp-digit" maxlength="1" inputmode="numeric" data-i="1">
      <input class="otp-digit" maxlength="1" inputmode="numeric" data-i="2">
      <input class="otp-digit" maxlength="1" inputmode="numeric" data-i="3">
      <input class="otp-digit" maxlength="1" inputmode="numeric" data-i="4">
      <input class="otp-digit" maxlength="1" inputmode="numeric" data-i="5">
    </div>

    <div id="status"></div>

    <button class="btn-solid" id="verifyBtn">Verify & Continue →</button>

    <div class="resend">
      Didn't get it? <button id="resendBtn">Resend code</button>
    </div>
  </div>

<script defer src="config.js"></script>
<script defer src="verify-otp.js"></script>
</body>
</html>
