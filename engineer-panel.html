<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNEXA AI — Engineer Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0e14; --sidebar:#0c1119; --panel:#111722; --panel-alt:#0d1420;
    --border:#1d2733; --text:#e8edf2; --muted:#7c8a99;
    --teal:#14b8a6; --teal-dim:rgba(20,184,166,0.14);
    --green:#22c55e; --gold:#eab308;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
  a{color:inherit;text-decoration:none;}

  .sidebar{width:230px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;transition:transform .25s ease;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#0891b2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#04231d;}
  .brand .name{font-size:15px;font-weight:700;line-height:1.1;}
  .brand .tag{font-size:10px;color:var(--muted);}
  nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500;}
  .navlink:hover{background:#141b26;color:var(--text);}
  .navlink.active{background:var(--teal-dim);color:var(--teal);}

  .main{margin-left:230px;flex:1;padding:18px 24px 40px;min-width:0;max-width:820px;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .hamburger{display:none;}
  .profile{display:flex;align-items:center;gap:9px;flex-shrink:0;margin-left:auto;}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#0891b2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#04231d;font-size:14px;overflow:hidden;flex-shrink:0;}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  h1{font-size:20px;}
  .subtitle{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .plan-card{background:linear-gradient(135deg,var(--panel),#0d1f1c);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px;}
  .plan-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;background:var(--panel-alt);border:1px solid var(--border);color:var(--muted);margin-bottom:10px;}
  .plan-badge.active{color:var(--green);border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.1);}
  .plan-title{font-size:17px;font-weight:700;margin-bottom:4px;}
  .plan-detail{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .btn-solid{background:var(--teal);color:#04231d;border:none;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;display:inline-block;}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .action-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;position:relative;}
  .action-card.locked{opacity:.55;}
  .action-icon{width:38px;height:38px;border-radius:10px;background:var(--teal-dim);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .action-card h3{font-size:14.5px;}
  .action-card p{font-size:12px;color:var(--muted);line-height:1.5;flex:1;}
  .lock-note{font-size:11px;color:var(--gold);}
  .empty-state{text-align:center;color:var(--muted);font-size:13px;padding:30px;}

  @media (max-width:820px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;padding:16px;}
    .hamburger{display:flex;width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--border);align-items:center;justify-content:center;color:var(--text);order:-1;}
  }
  @media (max-width:560px){
    .cards{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="brand">
    <div class="mark">G</div>
    <div><div class="name">GeoNEXA AI</div><div class="tag">Connecting the World, Spatial Sense</div></div>
  </div>
  <nav>
    <a class="navlink" href="dashboard.html">🏠 Dashboard</a>
    <a class="navlink" href="map-explorer.html">🗺️ Map Explorer</a>
    <a class="navlink active" href="engineer-panel.html">🧭 Engineer Panel</a>
    <a class="navlink" href="ai-assistant.html">🤖 AI Assistant</a>
    <a class="navlink" href="engineer-chat.html">💬 Team Chat</a>
    <a class="navlink" href="subscription.html">💳 Subscription</a>
    <a class="navlink" href="settings.html">⚙️ Settings</a>
  </nav>
</div>

<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div>
      <h1>Engineer Panel</h1>
      <div class="subtitle">Your workspace for AI analysis and team chat</div>
    </div>
    <div class="profile">
      <div class="avatar" id="avatarInitial">?</div>
    </div>
  </div>

  <div id="content">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<script src="config.js"></script>
<script src="loader.js"></script>
<script src="engineer-panel.js"></script>
</body>
</html>
